<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#0d1117"
    />

    <meta
      name="description"
      content="VK Browser — private, responsive web search and navigation."
    />

    <!-- =========================================================
         VK BROWSER ICON
         ========================================================= -->

    <!-- Browser favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/image.png"
    />

    <!-- Apple iPhone / iPad Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      href="/image.png"
    />

    <!-- Apple Home Screen icon with explicit sizes -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/image.png"
    />

    <!-- =========================================================
         APPLE WEB APP SETTINGS
         ========================================================= -->

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="VK Browser"
    />

    <!-- =========================================================
         WINDOWS / MICROSOFT TILE
         ========================================================= -->

    <meta
      name="msapplication-TileImage"
      content="/image.png"
    />

    <meta
      name="msapplication-TileColor"
      content="#0d1117"
    />

    <!-- =========================================================
         TITLE
         ========================================================= -->

    <title>VK Browser</title>
  </head>

  <body>
    <!-- React application -->
    <div id="root"></div>

    <!-- Vite / React entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
